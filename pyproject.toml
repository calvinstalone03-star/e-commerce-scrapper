[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecom-scraper"
version = "0.1.0"
description = "Marketplace price/product scraper (Shopee first, Tokopedia next) with a Playwright-bootstrap + httpx-fast-loop hybrid architecture."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "calvin" }]

dependencies = [
    "httpx[http2]",
    "playwright",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "typer",
    "python-dotenv",
    "tenacity",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.scripts]
ecom-scraper = "scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: opt-in test that launches a real browser or hits the live network",
]

[tool.ruff]
line-length = 100
target-version = "py311"
