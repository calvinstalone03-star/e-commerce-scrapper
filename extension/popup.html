<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #17171a;
        --muted: #74747c;
        --bg: #ffffff;
        --line: #e6e6ea;
        --accent: #d0021b;
        --ok: #17803d;
        --bad: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ededf0;
          --muted: #9a9aa3;
          --bg: #191919;
          --line: #303034;
          --accent: #ff5c5c;
          --ok: #4ade80;
          --bad: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px;
        width: 290px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      #site { font-weight: 600; }
      #site.off { color: var(--muted); font-weight: 400; }
      #gear {
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 14px;
        padding: 2px 4px;
        line-height: 1;
      }
      #gear:hover { color: var(--fg); }
      input[type="text"], input[type="number"] {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
      }
      input:focus { outline: none; border-color: var(--muted); }
      #shop { margin-top: 7px; }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 7px;
      }
      .row label {
        margin: 0;
        flex: 1;
        font-size: 11px;
        color: var(--muted);
      }
      .row input[type="number"] { width: 92px; flex: none; text-align: right; }
      button.primary {
        width: 100%;
        margin-top: 9px;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary:disabled { opacity: 0.45; cursor: default; }
      button.primary.stop { background: transparent; color: var(--fg); border: 1px solid var(--line); }
      /* Offered, not urged: continuing an interrupted walk is usually right, but
         a run left half-finished on purpose must not look like an error. */
      #resume {
        display: none;
        margin-top: 9px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.45;
      }
      #resume.on { display: block; }
      #resume button {
        margin-top: 6px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      /* The batch button: same width as the primary one, none of its weight. */
      #batch {
        width: 100%;
        margin-top: 7px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      #batch:disabled { opacity: 0.45; cursor: default; }
      #bhint { margin-top: 4px; font-size: 11px; }
      #bresume {
        display: none;
        margin-top: 9px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.45;
      }
      #bresume.on { display: block; }
      #bresume button {
        margin-top: 6px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      #bprogress {
        display: none;
        margin-top: 10px;
        font-size: 11px;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      #bprogress.on { display: block; }
      #bbar {
        height: 3px;
        margin-top: 5px;
        border-radius: 2px;
        background: var(--line);
        overflow: hidden;
      }
      #bbar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--fg);
        transition: width 0.25s ease;
      }
      /* Scrolls rather than growing: twenty shops is taller than a popup, and a
         popup that grows past the screen loses its own buttons. */
      #blist {
        display: none;
        max-height: 132px;
        overflow-y: auto;
        margin-top: 8px;
        font-size: 11px;
        line-height: 1.5;
      }
      #blist.on { display: block; }
      #blist div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 1px 0;
      }
      #blist span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #blist span:last-child { flex: none; font-variant-numeric: tabular-nums; }
      #blist .now { color: var(--fg); font-weight: 600; }
      #bretry {
        display: none;
        width: 100%;
        margin-top: 7px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #bretry.on { display: block; }
      #result { margin-top: 10px; min-height: 32px; font-size: 12px; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .muted { color: var(--muted); }
      #progress {
        display: none;
        margin-top: 9px;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #progress.on { display: block; }
      #bar {
        height: 3px;
        margin-top: 5px;
        border-radius: 2px;
        background: var(--line);
        overflow: hidden;
      }
      #bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.25s ease;
      }
      /* Two databases, one visibly chosen. A dropdown would hide which one is
         selected behind a click, and this is the control most worth being able
         to read at a glance before starting a run. */
      #dest {
        display: flex;
        gap: 0;
        margin-top: 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      #dest button {
        flex: 1;
        padding: 6px 8px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #dest button + button { border-left: 1px solid var(--line); }
      #dest button.on { background: var(--accent); color: #fff; font-weight: 600; }
      #dest button:disabled { opacity: 0.4; cursor: default; }
      #totals {
        display: flex;
        gap: 14px;
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      /* Names the database the numbers below come from. Without it the totals
         read as "the database", and there are two. */
      #tlabel {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
      #totals b {
        display: block;
        font-size: 15px;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      #plan {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }
      #plan b { color: var(--fg); font-weight: 600; }
      /* Hidden entirely when the server has only one database configured: a
         choice with one option is a question nobody should be asked. */
      #dest.solo { display: none; }
      #settings { display: none; margin-top: 12px; }
      #settings.open { display: block; }
      #settings label { display: block; margin: 9px 0 4px; font-size: 11px; color: var(--muted); }
      #save {
        width: 100%;
        margin-top: 9px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="site" class="off">—</span>
      <button id="gear" title="Pengaturan">⚙</button>
    </header>

    <!-- What the button is about to do, in words, so the collapsed form is not
         a button with hidden arguments. -->
    <div id="plan">—</div>

    <!-- Everything visible, nothing behind a disclosure. A storefront tab fills
         these in by itself, so the collapsed version was hiding fields that
         were already correct — but it also hid the shop about to be walked,
         the keyword filtering it, and which database the rows land in, which
         is the whole of what the button is about to do. -->
    <input type="text" id="shop" placeholder="toko — username / URL" />
    <input type="text" id="keyword" placeholder="kata kunci (opsional)" />

    <div class="row">
      <label for="target">jumlah produk</label>
      <input type="number" id="target" min="1" max="5000" step="10" value="2000" />
    </div>

    <div id="dest">
      <button id="dlocal" data-destination="local">Lokal</button>
      <button id="dneon" data-destination="neon">Neon</button>
    </div>

    <button class="primary" id="scrape">Mulai scrape</button>

    <!-- The second button is deliberately quieter than the first. One shop is
         the common thing; twenty shops is the occasional thing, and it navigates
         the tab for however long the list takes. -->
    <button id="batch">Scrape semua toko</button>
    <div id="bhint" class="muted">daftar dari config/stores.txt di server ingest</div>

    <div id="resume">
      <span id="rtext">—</span>
      <button id="rgo">Lanjutkan</button>
    </div>

    <div id="bresume">
      <span id="brtext">—</span>
      <button id="brgo">Lanjutkan batch</button>
    </div>

    <!-- The sweep's own line, above the shop's. Two scales of the same run:
         which shop of twenty, and which page of that shop. -->
    <div id="bprogress">
      <span id="bptext">—</span>
      <div id="bbar"><i></i></div>
    </div>

    <!-- One row per shop, filled in as the sweep goes. A list of twenty is not
         something a single status line can report. -->
    <div id="blist"></div>
    <button id="bretry">Ulangi toko yang gagal</button>

    <div id="progress">
      <span id="ptext">—</span>
      <div id="bar"><i></i></div>
    </div>

    <div id="result" class="muted"></div>

    <div id="tlabel">isi database lokal</div>
    <div id="totals">
      <div>produk<b id="tproducts">–</b></div>
      <div>snapshot<b id="tsnapshots">–</b></div>
      <div>toko<b id="tstores">–</b></div>
    </div>

    <div id="settings">
      <label for="endpoint">server ingest</label>
      <input type="text" id="endpoint" placeholder="http://127.0.0.1:8787" />
      <label for="token">token</label>
      <input type="text" id="token" placeholder="biasanya terisi sendiri" />
      <button id="save">Simpan</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
